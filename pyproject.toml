[project]
name = "eegexpcpp"
version = "0.4.0"
description = "EEG experiments — Python tooling alongside C++/LibTorch"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "numpy",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest"]
admin = ["plotly>=6.0.0", "streamlit>=1.45.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
